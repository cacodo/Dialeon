[build-system]
# setuptools>=77 -- mínimo que entende `license = "Apache-2.0"` como
# expressão SPDX (PEP 639) em vez da forma tabela antiga/deprecada.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-council"
version = "1.0.0"
description = "Sistema de debate multi-LLM com juiz, para chegar a respostas com alto grau de consenso auditável."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # 0.116.2 first permits Starlette 0.48; error handlers use its 422 constant.
    "fastapi>=0.116.2",
    "starlette>=0.48.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.28.1",
    "python-dotenv>=1.0",
    # SDKs oficiais dos 3 providers do MVP (Etapa 2 — Provider Layer)
    "openai>=1.55.3",
    # Repair (Run02 claim-extraction exhaustion) -- piso levantado de
    # >=0.40 pra >=1.5.0: o adapter (app/providers/anthropic_provider.py)
    # agora depende de `thinking={"type": "disabled"}`, uma forma de API
    # cuja compatibilidade NUNCA foi estabelecida pra versões abaixo de
    # 1.5.0 -- nenhuma evidência local (changelog/lockfile/wheel em
    # cache) determina a primeira versão histórica que introduziu
    # `thinking`/disabled-thinking; 1.5.0 é só a versão mais antiga pra
    # qual este repair tem evidência CONCRETA de compatibilidade
    # (instalada e validada deterministicamente neste repositório) --
    # nunca uma alegação de que 1.5.0 foi historicamente a primeira
    # versão a introduzir isso. Sem teto superior -- nenhuma versão
    # futura foi testada como incompatível.
    "anthropic>=1.5.0",
    "google-genai>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
dialeon = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

# Release Packaging Contract V1 -- inclui o frontend compilado como dado de
# pacote de `app`, nunca o código-fonte de frontend/ (que continua fora do
# pacote Python). `app/frontend_dist/` NÃO é versionado em Git (ver
# .gitignore) -- populado só no momento do release, via
# `scripts/sync_frontend_dist.py`, ANTES de `python -m build` (ver README,
# secao "Empacotamento de release"). Ausente em checkout de fonte/dev normal
# -- padrão glob que não casa nada não é erro, `app/api/frontend_serving.py`
# cai de volta pro `frontend/dist` de desenvolvimento, preservando o
# comportamento gracioso já existente quando nenhum build está presente.
[tool.setuptools.package-data]
app = ["frontend_dist/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: faz chamadas reais às APIs dos providers; requer API keys configuradas e NÃO roda por padrão",
]
# Por padrão, pytest NUNCA roda testes de integração (evita gasto/consumo de
# créditos sem intenção explícita). Para rodá-los: pytest -m integration
addopts = "-m 'not integration'"
