name: Minimum published dependencies

on:
  push:
  pull_request:

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install exact published floors
        run: |
          python -m venv "$RUNNER_TEMP/minimum"
          "$RUNNER_TEMP/minimum/bin/python" -m pip install \
            "$RUNNER_TEMP"/dist/*.whl \
            'fastapi==0.116.2' 'starlette==0.48.0' \
            'pydantic==2.12.0' 'google-genai==1.21.0' \
            'openai==1.55.3' 'httpx==0.28.1' \
            'anthropic==1.5.0' pytest pytest-asyncio
          "$RUNNER_TEMP/minimum/bin/python" -m pip check
      - name: Smoke installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/minimum/bin/python" "$GITHUB_WORKSPACE/scripts/minimum_install_smoke.py"
      - name: Focused API, bootstrap and provider regression
        run: |
          "$RUNNER_TEMP/minimum/bin/python" -m pytest -q \
            tests/api/test_run_creation_boundary.py \
            tests/api/test_create_run.py \
            tests/api/test_app_lifespan.py \
            tests/providers/test_factory.py \
            tests/providers/test_openai_provider.py \
            tests/providers/test_gemini_provider.py
